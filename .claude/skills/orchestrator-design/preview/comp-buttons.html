<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card"><div class="row" style="gap:12px;flex-wrap:wrap">
  <button style="background:#5BE49B;color:#062014;border:0;font-family:Geist,system-ui;font-weight:600;font-size:13px;padding:9px 16px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    New agent
  </button>
  <button style="background:#1A1D21;color:#ECEDEE;border:1px solid rgba(255,255,255,0.09);font-family:Geist,system-ui;font-weight:500;font-size:13px;padding:9px 14px;border-radius:8px;cursor:pointer">Resolve</button>
  <button style="background:transparent;color:#A8ABB0;border:1px solid rgba(255,255,255,0.09);font-family:Geist,system-ui;font-weight:500;font-size:13px;padding:9px 14px;border-radius:8px;cursor:pointer">Cancel</button>
  <button style="background:transparent;color:#FF9090;border:1px solid rgba(255,107,107,0.25);font-family:Geist,system-ui;font-weight:500;font-size:13px;padding:9px 14px;border-radius:8px;cursor:pointer">Delete</button>
  <button style="background:transparent;color:#5BE49B;border:0;font-family:Geist,system-ui;font-weight:500;font-size:13px;padding:9px 6px;cursor:pointer">Resolve all →</button>
  <button style="background:#1A1D21;color:#44464A;border:1px solid rgba(255,255,255,0.06);font-family:Geist,system-ui;font-weight:500;font-size:13px;padding:9px 14px;border-radius:8px;cursor:not-allowed">Disabled</button>
  <div style="flex-basis:100%"></div>
  <div style="font-family:Geist Mono,monospace;font-size:11px;color:#6C6F75">primary · secondary · ghost · danger-ghost · link · disabled</div>
</div></div></body></html>
