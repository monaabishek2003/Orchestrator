<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card"><div class="row" style="gap:18px;align-items:flex-end;width:100%;flex-wrap:wrap">
  <!-- Each stack: a teal bar at height N + token label below -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:14px;height:4px;background:#5BE49B;border-radius:1px"></div><div style="font-family:Geist Mono,monospace;font-size:10px;color:#6C6F75">1·4</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:14px;height:8px;background:#5BE49B;border-radius:1px"></div><div style="font-family:Geist Mono,monospace;font-size:10px;color:#6C6F75">2·8</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:14px;height:12px;background:#5BE49B;border-radius:1px"></div><div style="font-family:Geist Mono,monospace;font-size:10px;color:#6C6F75">3·12</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:14px;height:16px;background:#5BE49B;border-radius:1px"></div><div style="font-family:Geist Mono,monospace;font-size:10px;color:#6C6F75">4·16</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:14px;height:20px;background:#5BE49B;border-radius:1px"></div><div style="font-family:Geist Mono,monospace;font-size:10px;color:#6C6F75">5·20</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:14px;height:24px;background:#5BE49B;border-radius:1px"></div><div style="font-family:Geist Mono,monospace;font-size:10px;color:#6C6F75">6·24</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:14px;height:32px;background:#5BE49B;border-radius:1px"></div><div style="font-family:Geist Mono,monospace;font-size:10px;color:#6C6F75">8·32</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:14px;height:40px;background:#5BE49B;border-radius:1px"></div><div style="font-family:Geist Mono,monospace;font-size:10px;color:#6C6F75">10·40</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:14px;height:48px;background:#5BE49B;border-radius:1px"></div><div style="font-family:Geist Mono,monospace;font-size:10px;color:#6C6F75">12·48</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:14px;height:64px;background:#5BE49B;border-radius:1px"></div><div style="font-family:Geist Mono,monospace;font-size:10px;color:#6C6F75">16·64</div></div>
  <div style="margin-left:auto;font-family:Geist Mono,monospace;font-size:11px;color:#6C6F75">4px grid · --space-1 … --space-16</div>
</div></div></body></html>
