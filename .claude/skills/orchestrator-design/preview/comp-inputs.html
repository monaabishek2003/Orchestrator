<!doctype html>
<html><head><meta charset="utf-8"><title>Inputs</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding:16px 22px"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;width:100%">
  <div style="display:flex;align-items:center;gap:8px;background:#0D0E10;border:1px solid rgba(255,255,255,0.09);border-radius:8px;padding:8px 12px;width:260px">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6C6F75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input placeholder="Search agents…" style="background:transparent;border:0;outline:none;color:#ECEDEE;font-family:Geist,system-ui;font-size:13px;flex:1" />
    <span style="font-family:Geist Mono,monospace;font-size:11px;color:#44464A;border:1px solid rgba(255,255,255,0.09);padding:1px 5px;border-radius:4px">/</span>
  </div>
  <div style="display:flex;align-items:center;gap:6px;background:#0D0E10;border:1px solid rgba(91,228,155,0.55);border-radius:8px;padding:8px 12px;width:260px;box-shadow:0 0 0 3px rgba(91,228,155,0.22)">
    <input value="planner-agent-3" style="background:transparent;border:0;outline:none;color:#ECEDEE;font-family:Geist Mono,monospace;font-size:13px;flex:1" />
  </div>
  <div style="display:flex;align-items:center;gap:8px;background:#1A1D21;border:1px solid rgba(255,255,255,0.09);border-radius:8px;padding:8px 12px;cursor:pointer">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A8ABB0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
    <span style="color:#ECEDEE;font-family:Geist,system-ui;font-size:13px">Status</span>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6C6F75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </div>
</div></div></body></html>
