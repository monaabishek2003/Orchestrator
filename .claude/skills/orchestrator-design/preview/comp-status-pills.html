<!doctype html>
<html><head><meta charset="utf-8"><title>Status pills</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card"><div class="row" style="gap:14px;flex-wrap:wrap;align-items:center">
  <span style="display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;background:rgba(91,228,155,0.12);color:#8EF0B8;font-size:12px;font-weight:500;font-family:Geist,system-ui">
    <span style="width:6px;height:6px;border-radius:50%;background:#5BE49B;box-shadow:0 0 8px #5BE49B;animation:p 1.6s ease-in-out infinite"></span>Running
  </span>
  <span style="display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;background:rgba(245,181,68,0.13);color:#F7C875;font-size:12px;font-weight:500;font-family:Geist,system-ui">
    <span style="width:6px;height:6px;border-radius:50%;background:#F5B544"></span>Stalled
  </span>
  <span style="display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;background:rgba(255,107,107,0.13);color:#FF9090;font-size:12px;font-weight:500;font-family:Geist,system-ui">
    <span style="width:6px;height:6px;border-radius:50%;background:#FF6B6B"></span>Error
  </span>
  <span style="display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;background:rgba(170,175,182,0.10);color:#A8ABB0;font-size:12px;font-weight:500;font-family:Geist,system-ui">
    <span style="width:6px;height:6px;border-radius:50%;background:#6C6F75"></span>Done
  </span>
  <span style="display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;background:rgba(107,174,255,0.12);color:#93C5FF;font-size:12px;font-weight:500;font-family:Geist,system-ui">
    <span style="width:6px;height:6px;border-radius:50%;background:#6BAEFF"></span>Queued
  </span>
  <span style="display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;background:rgba(170,175,182,0.10);color:#A8ABB0;font-size:12px;font-weight:500;font-family:Geist,system-ui">
    <span style="width:6px;height:6px;border-radius:50%;background:transparent;border:1.5px solid #6C6F75"></span>Idle
  </span>
  <div style="flex-basis:100%"></div>
  <div style="font-family:Geist Mono,monospace;font-size:11px;color:#6C6F75">dim bg · solid 6px dot · pill radius · live dot pulses</div>
  <style>@keyframes p{0%,100%{opacity:1}50%{opacity:.4}}</style>
</div></div></body></html>
