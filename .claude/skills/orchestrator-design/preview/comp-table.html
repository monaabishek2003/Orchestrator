<!doctype html>
<html><head><meta charset="utf-8"><title>Table</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding:14px 22px"><div style="width:100%;background:#0D0E10;border:1px solid rgba(255,255,255,0.09);border-radius:12px;overflow:hidden">
  <div style="display:grid;grid-template-columns:1.4fr 1fr 2fr 1fr;padding:10px 16px;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#6C6F75;font-weight:500;font-family:Geist,system-ui;border-bottom:1px solid rgba(255,255,255,0.06)">
    <div>Name</div><div>Status</div><div>Last message</div><div style="text-align:right">Last update</div>
  </div>
  <div style="display:grid;grid-template-columns:1.4fr 1fr 2fr 1fr;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,0.06);align-items:center">
    <div style="font-family:Geist Mono,monospace;font-size:13px;color:#ECEDEE">agent-ok</div>
    <div><span style="display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:rgba(170,175,182,0.10);color:#A8ABB0;font-size:11px;font-weight:500;font-family:Geist,system-ui"><span style="width:5px;height:5px;border-radius:50%;background:#6C6F75"></span>Done</span></div>
    <div style="font-family:Geist Mono,monospace;font-size:12px;color:#A8ABB0">Step 5: processing batch 5</div>
    <div style="font-family:Geist Mono,monospace;font-size:12px;color:#6C6F75;text-align:right">about 4 hours ago</div>
  </div>
  <div style="display:grid;grid-template-columns:1.4fr 1fr 2fr 1fr;padding:11px 16px;background:rgba(255,255,255,0.025);align-items:center">
    <div style="font-family:Geist Mono,monospace;font-size:13px;color:#ECEDEE">resolve-test</div>
    <div><span style="display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:rgba(91,228,155,0.12);color:#8EF0B8;font-size:11px;font-weight:500;font-family:Geist,system-ui"><span style="width:5px;height:5px;border-radius:50%;background:#5BE49B;box-shadow:0 0 6px #5BE49B"></span>Running</span></div>
    <div style="font-family:Geist Mono,monospace;font-size:12px;color:#A8ABB0">blew up</div>
    <div style="font-family:Geist Mono,monospace;font-size:12px;color:#6C6F75;text-align:right">about 4 hours ago</div>
  </div>
</div></div></body></html>
