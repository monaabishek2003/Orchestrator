<!doctype html>
<html><head><meta charset="utf-8"><title>Status colors</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card"><div class="row" style="gap:18px;width:100%;flex-wrap:wrap">
  <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:rgba(91,228,155,0.12);color:#8EF0B8;font-size:12px;font-weight:500;font-family:Geist,system-ui">
    <span style="width:6px;height:6px;border-radius:50%;background:#5BE49B;box-shadow:0 0 6px #5BE49B"></span>Running
  </div>
  <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:rgba(245,181,68,0.13);color:#F7C875;font-size:12px;font-weight:500;font-family:Geist,system-ui">
    <span style="width:6px;height:6px;border-radius:50%;background:#F5B544"></span>Needs attention
  </div>
  <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:rgba(255,107,107,0.13);color:#FF9090;font-size:12px;font-weight:500;font-family:Geist,system-ui">
    <span style="width:6px;height:6px;border-radius:50%;background:#FF6B6B"></span>Error
  </div>
  <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:rgba(170,175,182,0.10);color:#A8ABB0;font-size:12px;font-weight:500;font-family:Geist,system-ui">
    <span style="width:6px;height:6px;border-radius:50%;background:#6C6F75"></span>Done
  </div>
  <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:rgba(107,174,255,0.12);color:#93C5FF;font-size:12px;font-weight:500;font-family:Geist,system-ui">
    <span style="width:6px;height:6px;border-radius:50%;background:#6BAEFF"></span>Info
  </div>
  <div style="flex-basis:100%;margin-top:4px"></div>
  <div style="display:flex;gap:24px;font-family:Geist Mono,monospace;font-size:11px;color:#6C6F75">
    <span>--running #5BE49B</span><span>--warning #F5B544</span><span>--danger #FF6B6B</span><span>--done #6C6F75</span><span>--info #6BAEFF</span>
  </div>
</div></div></body></html>
