<!doctype html>
<html><head><meta charset="utf-8"><title>Iconography</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding:16px 22px"><div style="display:flex;flex-wrap:wrap;gap:14px;width:100%;align-items:center">
  <style>
    .ic { width:36px; height:36px; border-radius:8px; background:#0D0E10; border:1px solid rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:center; color:#A8ABB0; }
    .ic img { width:18px; height:18px; filter:invert(74%) sepia(5%) saturate(220%) hue-rotate(180deg) brightness(96%) contrast(88%); }
  </style>
  <div class="ic"><img src="../assets/icons/layers.svg"></div>
  <div class="ic"><img src="../assets/icons/activity.svg"></div>
  <div class="ic"><img src="../assets/icons/alert-triangle.svg"></div>
  <div class="ic"><img src="../assets/icons/check-circle.svg"></div>
  <div class="ic"><img src="../assets/icons/play.svg"></div>
  <div class="ic"><img src="../assets/icons/pause.svg"></div>
  <div class="ic"><img src="../assets/icons/square.svg"></div>
  <div class="ic"><img src="../assets/icons/more-horizontal.svg"></div>
  <div class="ic"><img src="../assets/icons/chevron-down.svg"></div>
  <div class="ic"><img src="../assets/icons/chevron-right.svg"></div>
  <div class="ic"><img src="../assets/icons/search.svg"></div>
  <div class="ic"><img src="../assets/icons/filter.svg"></div>
  <div class="ic"><img src="../assets/icons/x.svg"></div>
  <div class="ic"><img src="../assets/icons/refresh.svg"></div>
  <div class="ic"><img src="../assets/icons/plus.svg"></div>
  <div class="ic"><img src="../assets/icons/settings.svg"></div>
  <div class="ic"><img src="../assets/icons/clock.svg"></div>
  <div class="ic"><img src="../assets/icons/message-square.svg"></div>
  <div style="margin-left:auto;display:flex;flex-direction:column;gap:2px;text-align:right">
    <div style="font-family:Geist Mono,monospace;font-size:11px;color:#A8ABB0">Lucide · 1.5px stroke</div>
    <div style="font-family:Geist Mono,monospace;font-size:11px;color:#6C6F75">14 / 16 / 18 / 20 / 24px</div>
  </div>
</div></div></body></html>
