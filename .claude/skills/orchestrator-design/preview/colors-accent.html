<!doctype html>
<html><head><meta charset="utf-8"><title>Accent</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card"><div class="row" style="gap:24px;width:100%;justify-content:flex-start">
  <div class="swatch-block"><div class="swatch" style="background:#5BE49B;box-shadow:0 0 24px rgba(91,228,155,0.35)"></div><div class="swatch-meta"><div class="swatch-name">Agentic green</div><div class="swatch-token">--accent</div><div class="swatch-value">#5BE49B</div></div></div>
  <div class="swatch-block"><div class="swatch" style="background:#6FECA8"></div><div class="swatch-meta"><div class="swatch-name">Hover</div><div class="swatch-token">--accent-hover</div><div class="swatch-value">#6FECA8</div></div></div>
  <div class="swatch-block"><div class="swatch" style="background:#4ACC87"></div><div class="swatch-meta"><div class="swatch-name">Press</div><div class="swatch-token">--accent-press</div><div class="swatch-value">#4ACC87</div></div></div>
  <div class="swatch-block"><div class="swatch" style="background:rgba(91,228,155,0.14);border-color:rgba(91,228,155,0.3)"></div><div class="swatch-meta"><div class="swatch-name">Tint / dim</div><div class="swatch-token">--accent-dim</div><div class="swatch-value">14% α</div></div></div>
  <div style="margin-left:auto;display:flex;gap:10px;align-items:center">
    <button style="background:#5BE49B;color:#062014;border:0;font-family:Geist,system-ui;font-weight:600;font-size:13px;padding:8px 14px;border-radius:8px;cursor:pointer">Resolve</button>
    <span style="color:#5BE49B;font-family:Geist Mono,monospace;font-size:12px">on-dark contrast 11.2:1</span>
  </div>
</div></div></body></html>
