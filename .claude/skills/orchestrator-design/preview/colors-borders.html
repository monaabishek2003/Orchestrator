<!doctype html>
<html><head><meta charset="utf-8"><title>Borders</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card"><div class="row" style="gap:16px;width:100%">
  <div style="flex:1;background:#0D0E10;border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:4px">
    <div style="font-size:13px;color:#A8ABB0">Hairline</div>
    <div style="font-family:Geist Mono,monospace;font-size:11px;color:#6C6F75">--border-1 · rgba(255,255,255,.06)</div>
  </div>
  <div style="flex:1;background:#0D0E10;border:1px solid rgba(255,255,255,0.09);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:4px">
    <div style="font-size:13px;color:#A8ABB0">Default</div>
    <div style="font-family:Geist Mono,monospace;font-size:11px;color:#6C6F75">--border-2 · rgba(255,255,255,.09)</div>
  </div>
  <div style="flex:1;background:#0D0E10;border:1px solid rgba(255,255,255,0.14);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:4px">
    <div style="font-size:13px;color:#A8ABB0">Emphasized</div>
    <div style="font-family:Geist Mono,monospace;font-size:11px;color:#6C6F75">--border-3 · rgba(255,255,255,.14)</div>
  </div>
  <div style="flex:1;background:#0D0E10;border:1px solid rgba(91,228,155,0.55);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:4px;box-shadow:0 0 0 3px rgba(91,228,155,0.22)">
    <div style="font-size:13px;color:#A8ABB0">Focus ring</div>
    <div style="font-family:Geist Mono,monospace;font-size:11px;color:#6C6F75">--border-focus + --shadow-focus</div>
  </div>
</div></div></body></html>
