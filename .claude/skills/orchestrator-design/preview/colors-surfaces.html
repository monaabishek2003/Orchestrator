<!doctype html>
<html><head><meta charset="utf-8"><title>Surfaces</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card"><div class="row" style="gap:18px">
  <div class="swatch-block"><div class="swatch" style="background:#08090A"></div><div class="swatch-meta"><div class="swatch-name">Page</div><div class="swatch-token">--bg-0</div><div class="swatch-value">#08090A</div></div></div>
  <div class="swatch-block"><div class="swatch" style="background:#0D0E10"></div><div class="swatch-meta"><div class="swatch-name">Panel</div><div class="swatch-token">--bg-1</div><div class="swatch-value">#0D0E10</div></div></div>
  <div class="swatch-block"><div class="swatch" style="background:#131518"></div><div class="swatch-meta"><div class="swatch-name">Raised</div><div class="swatch-token">--bg-2</div><div class="swatch-value">#131518</div></div></div>
  <div class="swatch-block"><div class="swatch" style="background:#1A1D21"></div><div class="swatch-meta"><div class="swatch-name">Hover</div><div class="swatch-token">--bg-3</div><div class="swatch-value">#1A1D21</div></div></div>
  <div class="swatch-block"><div class="swatch" style="background:#22262B"></div><div class="swatch-meta"><div class="swatch-name">Popover</div><div class="swatch-token">--bg-4</div><div class="swatch-value">#22262B</div></div></div>
</div></div></body></html>
