<!doctype html>
<html><head><meta charset="utf-8"><title>Stat cards</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding:18px 24px"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:100%">
  <div style="background:#0D0E10;border:1px solid rgba(255,255,255,0.09);border-radius:12px;padding:16px;display:flex;gap:14px;align-items:center">
    <div style="width:36px;height:36px;border-radius:8px;background:#1A1D21;border:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;color:#A8ABB0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.91a1 1 0 0 0 0-1.83Z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></svg>
    </div>
    <div style="display:flex;flex-direction:column;gap:2px">
      <div style="font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#6C6F75;font-weight:500;font-family:Geist,system-ui">Total agents</div>
      <div style="font-size:26px;font-weight:600;color:#ECEDEE;font-family:Geist,system-ui;letter-spacing:-0.01em">10</div>
    </div>
  </div>
  <div style="background:#0D0E10;border:1px solid rgba(255,255,255,0.09);border-radius:12px;padding:16px;display:flex;gap:14px;align-items:center">

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.5.5 0 0 1-.96 0L9.68 3.18a.5.5 0 0 0-.96 0l-2.35 8.36A2 2 0 0 1 4.44 13H2"/></svg>
    </div>
    <div style="display:flex;flex-direction:column;gap:2px">
      <div style="font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#6C6F75;font-weight:500;font-family:Geist,system-ui">Running</div>
      <div style="font-size:26px;font-weight:600;color:#ECEDEE;font-family:Geist,system-ui;letter-spacing:-0.01em">6</div>
    </div>
  </div>
  <div style="background:#0D0E10;border:1px solid rgba(255,255,255,0.09);border-radius:12px;padding:16px;display:flex;gap:14px;align-items:center">
    <div style="width:36px;height:36px;border-radius:8px;background:rgba(245,181,68,0.13);border:1px solid rgba(245,181,68,0.2);display:flex;align-items:center;justify-content:center;color:#F5B544">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
    </div>
    <div style="display:flex;flex-direction:column;gap:2px">
      <div style="font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#6C6F75;font-weight:500;font-family:Geist,system-ui">Needs attention</div>
      <div style="font-size:26px;font-weight:600;color:#ECEDEE;font-family:Geist,system-ui;letter-spacing:-0.01em">8</div>
    </div>
  </div>
  <div style="background:#0D0E10;border:1px solid rgba(255,255,255,0.09);border-radius:12px;padding:16px;display:flex;gap:14px;align-items:center">
    <div style="width:36px;height:36px;border-radius:8px;background:#1A1D21;border:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;color:#A8ABB0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>

    <div style="display:flex;flex-direction:column;gap:2px">
      <div style="font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#6C6F75;font-weight:500;font-family:Geist,system-ui">Completed</div>
      <div style="font-size:26px;font-weight:600;color:#ECEDEE;font-family:Geist,system-ui;letter-spacing:-0.01em">4</div>
    </div>
  </div>
</div></div></body></html>
