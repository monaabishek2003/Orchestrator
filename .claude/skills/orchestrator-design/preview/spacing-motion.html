<!doctype html>
<html><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card"><div class="row" style="gap:32px;width:100%;align-items:center">
  <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
    <div style="width:14px;height:14px;border-radius:50%;background:#5BE49B;box-shadow:0 0 12px #5BE49B;animation:pulse 1.6s cubic-bezier(0.4,0,0.6,1) infinite"></div>
    <div style="font-family:Geist Mono,monospace;font-size:10px;color:#6C6F75">live · 1.6s pulse</div>
  </div>
  <div style="height:50px;width:1px;background:rgba(255,255,255,0.06)"></div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="font-family:Geist Mono,monospace;font-size:12px;color:#A8ABB0"><span style="color:#5BE49B">--dur-1</span> 120ms · micro state</div>
    <div style="font-family:Geist Mono,monospace;font-size:12px;color:#A8ABB0"><span style="color:#5BE49B">--dur-2</span> 180ms · default</div>
    <div style="font-family:Geist Mono,monospace;font-size:12px;color:#A8ABB0"><span style="color:#5BE49B">--dur-3</span> 260ms · panel</div>
  </div>
  <div style="height:50px;width:1px;background:rgba(255,255,255,0.06)"></div>
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="font-family:Geist Mono,monospace;font-size:12px;color:#A8ABB0"><span style="color:#5BE49B">ease-out</span> cubic-bezier(.2,.7,.2,1)</div>
    <div style="font-family:Geist Mono,monospace;font-size:12px;color:#A8ABB0"><span style="color:#5BE49B">ease-in-out</span> cubic-bezier(.5,0,.2,1)</div>
  </div>
  <style>@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.45;transform:scale(.85)} }</style>
</div></div></body></html>
