services:
  orchestrator-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: orchestrator-dev
    container_name: orchestrator-dev
    ports:
      - "8000:8000"   # server + dashboard (prod-style static)
      - "3000:3000"   # next dev (hot reload UI)
    environment:
      - NODE_ENV=development
      - PORT=8000
      - DATABASE_URL=file:/data/dev.db
      - CHOKIDAR_USEPOLLING=true   # reliable file watching on macOS/Windows
      - WATCHPACK_POLLING=true
    volumes:
      # Bind-mount the repo so edits on the host trigger reloads inside the container
      - .:/repo
      # Anonymous volumes prevent host node_modules from masking container's
      - /repo/node_modules
      - /repo/apps/server/node_modules
      - /repo/apps/web/node_modules
      - /repo/packages/sdk/node_modules
      # Persist SQLite
      - orchestrator-data:/data
    working_dir: /repo

volumes:
  orchestrator-data:
